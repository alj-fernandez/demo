<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="540" fill="#0a0a0a"/>

  <!-- rayos de luz de fondo -->
  <g stroke="#3a1414" stroke-width="6" opacity="0.5">
    <line x1="480" y1="60" x2="120" y2="500"/>
    <line x1="480" y1="60" x2="300" y2="520"/>
    <line x1="480" y1="60" x2="480" y2="530"/>
    <line x1="480" y1="60" x2="660" y2="520"/>
    <line x1="480" y1="60" x2="840" y2="500"/>
  </g>

  <!-- stack de amplificadores izquierda -->
  <g stroke="#f2f2f2" stroke-width="7" fill="none" stroke-linejoin="round">
    <rect x="90" y="260" width="180" height="130" fill="#111"/>
    <rect x="90" y="130" width="180" height="130" fill="#111"/>
    <circle cx="130" cy="180" r="16" fill="#111"/>
    <circle cx="180" cy="180" r="16" fill="#111"/>
    <circle cx="230" cy="180" r="16" fill="#111"/>
    <circle cx="130" cy="310" r="16" fill="#111"/>
    <circle cx="180" cy="310" r="16" fill="#111"/>
    <circle cx="230" cy="310" r="16" fill="#111"/>
  </g>

  <!-- stack de amplificadores derecha -->
  <g stroke="#f2f2f2" stroke-width="7" fill="none" stroke-linejoin="round">
    <rect x="690" y="260" width="180" height="130" fill="#111"/>
    <rect x="690" y="130" width="180" height="130" fill="#111"/>
    <circle cx="730" cy="180" r="16" fill="#111"/>
    <circle cx="780" cy="180" r="16" fill="#111"/>
    <circle cx="830" cy="180" r="16" fill="#111"/>
    <circle cx="730" cy="310" r="16" fill="#111"/>
    <circle cx="780" cy="310" r="16" fill="#111"/>
    <circle cx="830" cy="310" r="16" fill="#111"/>
  </g>

  <!-- guitarra flying V al centro -->
  <g stroke="#f2f2f2" stroke-width="7" fill="#111" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 480 150 L 420 260 L 480 340 L 540 260 Z"/>
    <rect x="465" y="330" width="30" height="150"/>
    <path d="M 465 480 L 480 520 L 495 480 Z" fill="#111"/>
    <circle cx="480" cy="200" r="10" fill="#0a0a0a"/>
  </g>

  <!-- cintillo con humo -->
  <g stroke="#f2f2f2" stroke-width="4" fill="none" opacity="0.7">
    <path d="M 200 460 Q 480 420 760 460"/>
  </g>
</svg>
